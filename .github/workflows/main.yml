name: Publish AI news

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-news-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install libraries
        run: python -m pip install -r requirements.txt

      - name: Check the publisher
        run: python -m unittest discover -s tests -v

      - name: Find and publish posts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
          MAX_POSTS: "1"
          FRESH_HOURS: "48"
          MIN_SCORE: "6.0"
        run: python bot.py

      - name: Save duplicate-protection state
        if: always()
        run: |
          if git diff --quiet -- data/state.json; then
            exit 0
          fi
          git config user.name "ai-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update published news state"
          git push
